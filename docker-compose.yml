services:
  powerbi-ip-whitelist:
    build:
      context: .
      network: host
    container_name: powerbi-ip-whitelist
    image: powerbi-ip-whitelist:latest
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - /etc/ufw:/etc/ufw
      - /lib/modules:/lib/modules
